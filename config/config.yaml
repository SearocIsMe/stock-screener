# Database Configuration
database:
  postgres:
    host: localhost
    port: 5432
    username: stock_user
    password: 7788
    database: stock_screener
  redis:
    host: localhost
    port: 6379
    password: ""
    db: 0
    expiration_days: 30  # Expiration time for filtered stocks in days

# API Configuration
api:
  host: 0.0.0.0
  port: 8000
  debug: true

# Data Fetching Configuration
data_fetching:
  yfinance:
    batch_size: 100  # Number of stocks to fetch in a single batch
    retry_attempts: 3
    retry_delay: 5  # Seconds
  scrapy:
    concurrent_requests: 16
    download_delay: 0.5  # Seconds

# Technical Indicators Configuration
indicators:
  ema:
    daily:
      periods: [13, 21]  # EMA periods for daily timeframe
    weekly:
      periods: [13, 21]  # EMA periods for weekly timeframe - OPTIMIZED
    monthly:
      periods: [4, 8]    # EMA periods for monthly timeframe - OPTIMIZED
  
  # Moving Averages for trend analysis - OPTIMIZED
  ma:
    daily:
      periods: [10, 20, 50]  # MA periods for daily timeframe
    weekly:
      periods: [8, 13, 20]   # MA periods for weekly timeframe - OPTIMIZED
    monthly:
      periods: [3, 6, 12]    # MA periods for monthly timeframe - OPTIMIZED
  
  bias:
    # BIAS calculation: (Close - EMA) / EMA * 100
    daily:
      threshold: -8  # Filter stocks with BIAS below this threshold
    weekly:
      threshold: -5
    monthly:
      threshold: -3
  
  rsi:
    daily:
      period: 14
      oversold: 30  # RSI below this is considered oversold
      overbought: 70  # RSI above this is considered overbought
    weekly:
      period: 14
      oversold: 35      # OPTIMIZED: Earlier signal detection
      overbought: 65    # OPTIMIZED: Earlier signal detection
    monthly:
      period: 14
      oversold: 35      # OPTIMIZED: More permissive for monthly
      overbought: 65    # OPTIMIZED: More permissive for monthly
      # Monthly RSI specific thresholds - OPTIMIZED
      uptrend_min: 40   # OPTIMIZED: Relaxed from 50 to 40
      uptrend_target: 70 # OPTIMIZED: Extended from 60 to 70
      momentum_min: 45  # NEW: For momentum building detection
      momentum_max: 65  # NEW: For momentum building detection
  
  macd:
    daily:
      fast_period: 12
      slow_period: 26
      signal_period: 9
    weekly:
      fast_period: 8      # OPTIMIZED: Faster response for weekly
      slow_period: 21     # OPTIMIZED: Faster response for weekly
      signal_period: 7    # OPTIMIZED: Faster signal for weekly
    monthly:
      fast_period: 5      # OPTIMIZED: Even faster for monthly
      slow_period: 10     # OPTIMIZED: Faster for monthly
      signal_period: 4    # OPTIMIZED: Faster signal for monthly
  
  # Bollinger Bands configuration - OPTIMIZED
  bollinger:
    daily:
      period: 20
      std_dev: 2.0
    weekly:
      period: 15         # OPTIMIZED: More sensitive than 20
      std_dev: 1.8       # OPTIMIZED: Tighter bands for earlier signals
    monthly:
      period: 10         # OPTIMIZED: More responsive than 20 for monthly
      std_dev: 1.5       # OPTIMIZED: Tighter bands for monthly trends
  
  # DMI (Directional Movement Index) configuration
  dmi:
    daily:
      period: 13
    weekly:
      period: 8
    monthly:
      period: 5
  
  # ATR (Average True Range) configuration
  atr:
    daily:
      period: 13
    weekly:
      period: 8
    monthly:
      period: 5
  
  # Stochastic Oscillator configuration
  stochastic:
    daily:
      k_period: 14
      d_period: 3
      smooth_k: 3
    weekly:
      k_period: 14
      d_period: 3
      smooth_k: 3
    monthly:
      k_period: 14
      d_period: 3
      smooth_k: 3
  
  # Williams %R configuration
  williams_r:
    daily:
      period: 14
    weekly:
      period: 14
    monthly:
      period: 14

# Weekly and Monthly Filtering Criteria
filtering_criteria:
  weekly:
    # Combination 1: Weekly Double MA + MACD Golden Cross
    combination_1:
      ma10_above_ma20: true          # MA10 > MA20 (bullish alignment)
      macd_golden_cross: true        # MACD just formed golden cross
      volume_increase: true          # Weekly volume increase YoY
    
    # Combination 2: Monthly trend up + Weekly volume breakout
    combination_2:
      ma10_above_ma20: true          # MA10 > MA20 (bullish alignment)
      volume_breakout: true          # Weekly volume breakout of resistance
      macd_near_golden_cross: true   # MACD approaching golden cross
      dmi_positive_turn: true        # DMI positive turn
    
    # Combination 3: Monthly RSI + Bollinger squeeze breakout
    combination_3:
      bollinger_breakout: true       # Breakout above Bollinger middle/upper band
      obv_uptrend: true             # OBV trending upward
  
  monthly:
    # Condition 1: Monthly 3 consecutive green candles or above 20MA
    condition_1:
      three_green_candles: true      # 3 consecutive monthly green candles
      above_ma20: true              # OR above 20-month MA
    
    # Condition 2: Bollinger squeeze -> expansion
    condition_2:
      bollinger_squeeze_expansion: true  # Bollinger bands squeeze then expand upward
    
    # Condition 3: Monthly RSI momentum
    condition_3:
      rsi_momentum_50_to_60: true    # RSI moving from 50 towards 60

# Financial Metrics Thresholds
financial_metrics:
  gross_margin_threshold: 0.3  # 毛利率 (Gross Profit Margin) threshold (30%)
  roe_threshold: 0.05  # 净资产收益率 (Return on Equity) threshold (15%)
  rd_ratio_threshold: 0.07  # 研发比率 (R&D Ratio) threshold (10%)
  enable_financial_filtering: true  # Enable/disable financial metrics filtering

# Stock Exchanges
exchanges:
  - SP500
  - NASDAQ
  - NYSE
  - AMEX
  - ACN