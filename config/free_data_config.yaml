# Free Data Sources Configuration
# This configuration enables free alternatives to paid APIs

free_data_sources:
  enabled: true
  
  # Priority order for data sources (1 = highest priority)
  priority:
    historical_data:
      - yfinance          # Priority 1: Most reliable free source
      - pandas_datareader # Priority 2: Multiple free sources
      - fmp_api          # Priority 3: Paid API (fallback)
    
    fundamentals:
      - yahoo_finance    # Priority 1: Free and comprehensive
      - fmp_api         # Priority 2: Paid API (fallback)
    
    stock_profiles:
      - yahoo_finance    # Priority 1: Free and comprehensive
      - fmp_api         # Priority 2: Paid API (fallback)

  # Rate limiting settings for free sources
  rate_limits:
    yfinance:
      requests_per_second: 2
      delay_between_requests: 0.5
    
    yahoo_finance:
      requests_per_second: 1
      delay_between_requests: 1.0
    
    pandas_datareader:
      requests_per_second: 1
      delay_between_requests: 1.0

  # Fallback behavior
  fallback:
    max_retries: 3
    retry_delay: 2.0
    use_cache: true
    cache_duration_hours: 24

# Data source specific settings
data_sources:
  yfinance:
    auto_adjust: true      # Automatically adjust for splits and dividends
    prepost: false         # Don't include pre/post market data
    threads: true          # Use threading for faster downloads
    
  pandas_datareader:
    sources: ['yahoo']  #'stooq', 'yahoo' Try these sources in order
    
  yahoo_finance:
    timeout: 30
    max_workers: 5         # For concurrent requests

# Monitoring and logging
monitoring:
  log_data_source_usage: true
  track_api_limits: true
  alert_on_failures: true